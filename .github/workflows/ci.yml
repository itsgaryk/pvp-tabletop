name: CI

# What this checks, and why these things:
#
#   the relay's own rules  tools/relay-check.mjs, against a dev server pointed at
#                          a stand-in store, with the idle, host-wait and rejoin
#                          windows turned down to seconds so the whole lifecycle
#                          runs here
#   the app compiles       `npm run build`, the same command Vercel runs
#   the docs still link    tools/docs-check.mjs, because the README and docs/ are
#                          read by following links between them, and a stale link
#                          renders as ordinary text rather than reporting itself
#   a size is stated once tools/card-sizing-check.mjs, because a card on the board
#                          being the size of its zone was decided in nine
#                          components at once and got wrong in five of them
#   the app renders        tools/render-check.mjs, because compiling is not
#                          rendering: a component can throw on mount and leave the
#                          app dead with the build above still green
#   a hung relay is a      tools/relay-timeout-check.mjs, because a request with no
#   dead dialog            deadline leaves a player on "Working..." with no button
#                          left to press
#   a zone is named        tools/zone-vocabulary-check.mjs, because a zone's store
#   the same way twice     name is also its wire name, and a rename that looks like
#                          tidying makes a card silently stop moving on the other
#                          board (see docs/terminology.md)
#   the tree is reviewable  nothing else; a browser check needs real browsers and
#                          is run by hand (tools/browser-check.mjs)
#
# It deliberately does not touch a real database: the relay's commands are
# counted by tools/fake-redis.mjs, so a metered Upstash quota is never spent by
# a push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # the store the relay talks to: Upstash's REST protocol, counted
      - name: Start the stand-in store
        run: node tools/fake-redis.mjs &

      - name: Start the dev server on short windows
        env:
          KV_REST_API_URL: http://127.0.0.1:6390
          KV_REST_API_TOKEN: local
          RELAY_IDLE_MS: 3000
          RELAY_PROMPT_MS: 5000
          RELAY_MEMBER_STALE_MS: 8000
          RELAY_HOST_WAIT_MS: 3000
          RELAY_REJOIN_WAIT_MS: 10000
          RELAY_POLL_WAIT_MS: 1000
          RELAY_POLL_INTERVAL_MS: 300
        run: npm run dev &

      - name: Wait for the relay
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3005/api/relay/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "the dev server never answered"
          exit 1

      - name: Check the relay's behaviour
        env:
          BASE: http://localhost:3005
          FAKE: http://127.0.0.1:6390
        run: node tools/relay-check.mjs

      - name: Build
        run: npm run build

  # the checks that need nothing but the tree: the documentation's own links (a
  # file or an anchor that has moved, which nothing else would notice), the card
  # sizes (a rule that is only correct while it is stated once), and whether the app
  # renders at all - a component can throw on mount while the build above is green,
  # which is how the board was dead with every check passing.
  #
  # Still called `docs` for a job that is no longer only about docs: renaming it
  # would quietly unrequire it wherever the old name is a required status check.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node tools/docs-check.mjs

      - run: node tools/card-sizing-check.mjs

      - run: node tools/render-check.mjs

      - run: node tools/relay-timeout-check.mjs

      - run: node tools/zone-vocabulary-check.mjs
